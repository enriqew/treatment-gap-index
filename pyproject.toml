[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "treatment-gap-index"
version = "0.1.0"
description = "Composite pharmacogenomic equity index for transplant immunosuppressants"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "jsonschema>=4.23.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-mock>=3.14.0", "ruff>=0.7.0", "mypy>=1.11.0"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
